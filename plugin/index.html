<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
    <script src="timeline.js"></script>
    <script src="index.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header>
        <div>
          <p class="eyebrow">本地字幕工作台</p>
          <h1>CaptionGuard CN</h1>
        </div>
        <span id="service-badge" class="badge badge-muted">未检查</span>
      </header>

      <section class="card">
        <div class="section-heading">
          <h2>1. 本地服务</h2>
          <button id="check-service" class="button button-secondary">检查</button>
        </div>
        <p id="service-message" class="hint">请先启动 Python 本地服务。</p>
      </section>

      <section class="card">
        <h2>2. 转写设置</h2>
        <label>
          语言
          <select id="language">
            <option value="auto">自动检测</option>
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
        </label>
        <div class="two-columns">
          <label>
            模型
            <select id="model-size">
              <option value="small">small</option>
              <option value="base">base</option>
              <option value="medium">medium</option>
              <option value="large-v3">large-v3</option>
              <option value="turbo">turbo</option>
            </select>
          </label>
          <label>
            每条最多字数
            <input id="max-chars" type="number" min="4" max="80" value="20" />
          </label>
        </div>
        <label>
          术语表（每行：错误写法 = 正确写法）
          <textarea id="glossary" rows="4" placeholder="Open AI = OpenAI&#10;普利米尔 = Premiere"></textarea>
        </label>
      </section>

      <section class="card">
        <div class="section-heading">
          <h2>3. Premiere 时间线</h2>
          <button id="refresh-sequence" class="button button-secondary">刷新</button>
        </div>
        <p id="sequence-name" class="file-name">正在读取活动序列…</p>
        <p id="sequence-range" class="hint"></p>
        <label class="checkbox-row">
          <input id="use-in-out" type="checkbox" checked />
          优先导出序列入点到出点
        </label>
        <button id="choose-preset" class="button button-secondary button-wide">选择音频导出预设（.epr）</button>
        <p id="preset-name" class="file-name">尚未选择导出预设</p>
        <button id="timeline-transcribe" class="button button-primary button-wide" disabled>导出时间线并转写</button>

        <div class="divider"><span>或使用已有音频</span></div>
        <button id="choose-audio" class="button button-secondary button-wide">选择音频文件</button>
        <p id="audio-name" class="file-name">尚未选择文件</p>
        <button id="transcribe" class="button button-primary button-wide" disabled>开始本地转写</button>
        <div id="progress" class="progress" hidden>
          <div class="spinner"></div>
          <span id="progress-message">正在转写，请保持本地服务运行…</span>
        </div>
      </section>

      <section id="result-card" class="card" hidden>
        <div class="section-heading">
          <h2>转写结果</h2>
          <span id="result-summary" class="badge"></span>
        </div>
        <div id="review-list" class="review-list"></div>
        <button id="save-srt" class="button button-primary button-wide">保存 SRT</button>
      </section>

      <p id="error-message" class="error" hidden></p>
    </main>
  </body>
</html>
