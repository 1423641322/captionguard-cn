[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "captionguard-cn"
version = "0.3.0"
description = "Local-first Chinese subtitle review service for Adobe Premiere Pro"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CaptionGuard CN contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]
desktop = [
  "pillow>=11,<13",
  "pystray>=0.19,<1",
]

[project.scripts]
captionguard-server = "captionguard.api:run"
captionguard-desktop = "captionguard.desktop:run"

[tool.hatch.build.targets.wheel]
packages = ["backend/captionguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
